# SPDX-License-Identifier: GPL-3.0-only
# GPL-3.0 because it links Slint under GPL-3.0 (NeoSymbian decision 2026-11-06), like neoui's apps.
[package]
name = "neoweb-ui"
description = "NEOWEB's screens in Slint (no_std): the address bar, the footer, the start page, the stand-in pages"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"

[dependencies]
slint = { workspace = true }

[build-dependencies]
# the neoui kit (@neoui/kit.slint): theme, fonts, glyphs and components
neoui-kit = { workspace = true }

[dev-dependencies]
png = { workspace = true }
neoweb-core = { workspace = true }
