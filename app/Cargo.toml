# SPDX-License-Identifier: Apache-2.0
# The host workspace of the browser app NEOWEB (docs browser-ui.md): the pure parts (neoweb-core, Apache-2.0) and the
# Slint screens (neoweb-ui, GPL-3.0: it links Slint), tested on the host. The EXE is the separate ../symbian workspace
# (armv5te, nightly build-std); the Servo cross-build is ../crates (Docker only).
[workspace]
resolver = "3"
members = ["neoweb-core", "neoweb-proto", "neoweb-ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
neoweb-core = { path = "neoweb-core" }
neoweb-ui = { path = "neoweb-ui" }
# NeoSymbian/neoui: the kit (theme, fonts, glyphs, components) as a build helper; the rev neoui's APPS knows NEOWEB at
neoui-kit = { git = "https://github.com/NeoSymbian/neoui", rev = "0ca50cfb6ba6ebd488658e440da229523ef50601" }
# the same Slint as neoui (one copy in the ROM, no_std)
slint = { version = "=1.18.1", default-features = false, features = ["compat-1-2", "unsafe-single-threaded", "libm", "renderer-software"] }
png = "=0.18.1"
