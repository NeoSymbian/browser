# NEOWEB.EXE (no_std, a neoui app) and PIPSPROB: ARMv8-A AArch32, ARM state, VFP/NEON inside functions, soft-float
# calling convention (docs user-side-smp.md US4). Never use an eabihf target.
#
#   cargo arm          the staticlibs: target/armv8a-neosymbian-eabi/release/lib*.a (core built from source)
#   cargo clippy-arm   clippy for the same target
# targets/armv8a-neosymbian-eabi.json is a byte-identical copy of NeoSymbian/e32-rs's; the std EXEs (std/) use its twin.
[alias]
arm = "build --release --target targets/armv8a-neosymbian-eabi.json -Zjson-target-spec -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem"
clippy-arm = "clippy --release --target targets/armv8a-neosymbian-eabi.json -Zjson-target-spec -Zbuild-std=core,alloc,compiler_builtins -Zbuild-std-features=compiler-builtins-mem"
