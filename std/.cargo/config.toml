# SPDX-License-Identifier: Apache-2.0
# ARMv7-A + NEON, softfp, with std (targets/armv7a-symbian-eabi.json; docs browser-std.md):
#   cargo sym    the staticlibs: target/armv7a-symbian-eabi/release/lib*.a, for build's rust/ (exes.txt)
[alias]
sym = "build --release --target targets/armv7a-symbian-eabi.json -Zjson-target-spec -Zbuild-std=std,panic_abort"


[env]
# mozjs_sys: SpiderMonkey from source (no prebuilt archive exists for armv7a-symbian-eabi)
MOZJS_FROM_SOURCE = "1"
# build scripts that call rustc for the target by name (autocfg) find its JSON here
RUST_TARGET_PATH = { value = "targets", relative = true }
