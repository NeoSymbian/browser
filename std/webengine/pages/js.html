<html><head><meta charset="utf-8"><title>NeoWeb: JS (waiting)</title>
<style>body{font-family:sans-serif;margin:16px} #out{font-size:32px;padding:16px;border-radius:12px;background:#ddd}
#out.ok{background:#188038;color:#fff} li{font-size:20px}</style></head>
<body><h1>JavaScript</h1><div id="out">waiting…</div><ul id="list"></ul>
<script>
  const out = document.getElementById('out');
  const list = document.getElementById('list');
  const add = (t) => { const li = document.createElement('li'); li.textContent = t; list.appendChild(li); };
  add('sync: ' + [3, 1, 2].sort().join(','));
  Promise.resolve(41).then((v) => add('promise: ' + (v + 1)));
  (async () => { await null; add('async/await: ok'); })();
  setTimeout(() => {
    add('setTimeout: ok');
    const m = new Map([['a', 1]]); add('Map: ' + m.get('a'));
    add('JSON: ' + JSON.stringify({ x: [1, 2] }));
    out.textContent = 'JS OK';
    out.className = 'ok';
    document.title = 'NeoWeb: JS OK';
  }, 100);
</script></body></html>
