<!doctype html>

<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>NeoWeb: text and layout</title>
<style>
  body { font-family: sans-serif; margin: 16px; color: #1b1f24; background: #f6f7f9; }
  h1 { font-size: 28px; color: #0b57d0; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; margin: 12px 0; }
  .box { flex: 1; padding: 10px; border-radius: 10px; color: #fff; font-weight: bold; text-align: center; }
  .a { background: #d93025; } .b { background: #188038; } .c { background: #f9ab00; color: #000; }
  table { border-collapse: collapse; width: 100%; } td, th { border: 1px solid #c4c7c5; padding: 6px; }
  .serif { font-family: serif; font-style: italic; } .mono { font-family: monospace; }
</style></head>
<body>
<h1>Servo on NeoSymbian</h1>
<p>English, <b>bold</b>, <i>italic</i>. Русский текст. Հայերեն տեքստ. Ελληνικά.</p>
<p class="serif">Serif italic: the quick brown fox jumps over the lazy dog.</p>
<p class="mono">mono: fn main() { println!("hello"); }</p>
<div class="row"><div class="box a">red</div><div class="box b">green</div><div class="box c">yellow</div></div>
<table><tr><th>Stage</th><th>State</th></tr><tr><td>WB3</td><td>done</td></tr><tr><td>WB4</td><td>this page</td></tr></table>
<ol><li>one</li><li>two</li><li>three</li></ol>
</body></html>
