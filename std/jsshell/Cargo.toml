[package]
name = "jsshell"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
e32.workspace = true
cxxrt = { path = "../cxxrt" }
# the NeoSymbian/mozjs fork (WB3 commit, mozjs#1 into branch neosymbian): mozjs 0.26.13 / mozjs_sys 153.6.0, Servo 0.8.0's; no JIT, no Intl
mozjs = { git = "https://github.com/NeoSymbian/mozjs", rev = "d89d9dc80b60c9c32cb097d7d5cc1e31f265420c", default-features = false, features = ["libz-rs"] }
